# dsh-btw 静态挂载示例
#
# 方式一（推荐，零构建）：动态插件 —— 见 README「方式一」。
#   运行 node scripts/to-dynamic.mjs 生成 dist/dynamic-host.js 与
#   dist/dynamic-client.js，分别粘贴为 cordis_define 的 code.host / code.client。
#
# 方式二（静态挂载）：把本仓库作为本地包安装到 DSH Loader 可解析的路径，
# 然后在 agent preset（或 host 组合）中挂载以下行：
#
# - id: dsh-btw
#   name: dsh-btw
#
# 说明：
# - Host 半区（src/host.js）是普通 Cordis 插件行：注册 /btw 命令、
#   创建/复用只读分支、维护问答历史、暴露 btw/ask|state|clear RPC。
# - Client 半区（src/client.js）经 package.json 的 dsh.client 声明由
#   client-modules 扫描加载：注册会话头部 BTW 按钮 + 左侧面板。
# - 静态方式需要 client bundle 构建管线（tsdown 等）；当前源码为纯 JS，
#   如构建遇到问题请回退到方式一（动态插件，已在 DSH 会话内验证通过）。
